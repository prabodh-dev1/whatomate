# Build Whatomate from the submodule (local image prabodh/whatomate:local).
# Included by /opt/devops/docker-compose.yaml — from devops repo root:
#   docker compose --profile whatomate up -d app --build
# Manual (same stack, separate -f files):
#   docker compose -f docker-compose.yml -f docker-compose.devops.yml -f docker-compose.build.yml \
#     --profile whatomate up -d app --build
services:
  app:
    image: prabodh/whatomate:local
    entrypoint: ["./whatomate"]
    build:
      context: ..
      dockerfile: whatsapp-docker/Dockerfile
