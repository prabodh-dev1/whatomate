# Standalone Whatomate stack (host ports in 7xxx series to avoid devops conflicts).
# Behind devops nginx: docker compose -f docker-compose.yml -f docker-compose.devops.yml --profile whatomate up -d
services:
  app:
    image: shridh0r/whatomate:latest
    container_name: whatomate_app
    restart: unless-stopped
    profiles: ["whatomate"]
    ports:
      - "127.0.0.1:7080:8080"
    networks:
      - whatomate
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads:rw
      - ./config.toml:/app/config.toml:ro
    command: ["server", "-migrate", "-config", "/app/config.toml"]

  db:
    image: postgres:17-alpine
    container_name: whatomate_db
    restart: unless-stopped
    profiles: ["whatomate"]
    networks:
      - whatomate
    ports:
      - "127.0.0.1:7432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whatomate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whatomate}
      POSTGRES_DB: ${POSTGRES_DB:-whatomate}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whatomate} -d ${POSTGRES_DB:-whatomate}"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: whatomate_redis
    restart: unless-stopped
    profiles: ["whatomate"]
    networks:
      - whatomate
    ports:
      - "127.0.0.1:7379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data

networks:
  whatomate:

volumes:
  postgres-data:
  redis-data:
